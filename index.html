<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crystal Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f1b16">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crystals">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--bg:#f1e9df;--paper:#f9f6f1;--ink:#1f1b16;--soft:#6b6358;--gold:#a98a4f;--tint:#efe6d8;--bar:#1f1b16;--barink:#f9f6f1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}


*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,sans-serif}
.frame{position:relative;max-width:460px;margin:14px auto 120px;padding:6px;border:1px solid var(--gold);background:var(--bg);border-radius:28px}
.in{border:1px solid var(--gold);background:var(--paper);padding:22px 20px 26px;border-radius:22px}
.serif{font-family:Lora,Georgia,serif}
.cap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.logo{display:block;width:100%;height:120px;box-sizing:border-box;margin:-4px 0 14px;padding:0;border-radius:22px;border:1px solid var(--gold);background:var(--paper);object-fit:cover;object-position:50% 62%}
.med{width:88px;height:88px;border-radius:22px;overflow:hidden;border:1px solid var(--gold);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--tint)}.med img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:Lora,serif;font-weight:400;font-size:40px;text-align:center;margin:6px 0 0}
.sub{font-family:Lora,serif;font-style:italic;text-align:center;color:var(--soft);font-size:17px;margin:2px 0 14px}
.rule{display:flex;align-items:center;gap:12px;margin:0 0 16px}.rule i{flex:1;height:1px;background:var(--gold)}.rule b{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
input,select,textarea{width:100%;font:italic 16px Lora,serif;color:var(--ink);background:var(--paper);border:1px solid var(--gold);padding:12px 14px;border-radius:14px;margin:0}
select{font-style:normal;font-family:Lato,sans-serif}
textarea{min-height:76px;font-style:normal}
button{font:600 19px/1.1 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;font-variant:small-caps;letter-spacing:.07em;text-transform:none;color:var(--ink);background:transparent;border:1px solid rgba(169,138,79,.55);padding:11px 16px;border-radius:999px;cursor:pointer}
button.on{background:var(--tint);color:var(--ink);border-color:var(--gold)}button.gold{border-color:var(--gold)}
.row{display:flex;gap:8px;margin:0 0 12px}.row>*{flex:1}.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.scroll button{flex:none;padding:8px 12px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--paper);outline:1px solid var(--gold);flex:none;padding:0}.sw.sel{outline:2px solid var(--ink)}
.note{border-radius:18px;background:var(--tint);border:1px solid var(--gold);padding:14px;margin:0 0 14px;font-family:Lora,serif;font-style:italic;color:var(--soft)}
.note button{display:block;margin-top:10px;font-style:normal}
.card{border-radius:20px;border:1px solid var(--gold);padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer}
.chip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.card .chip{position:relative;overflow:hidden;width:58px;height:58px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 1px 4px rgba(31,27,22,.18)}
.card h3{font:400 20px Lora,serif;margin:0}.card p{margin:2px 0 0;font:italic 14px Lora,serif;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{display:block}.grid .chip{width:100%;height:70px;margin-bottom:6px}
.tag{display:inline-block;border-radius:999px;border:1px solid var(--gold);padding:5px 13px;margin:0 6px 6px 0;font-size:13px}
.lbl{display:block;margin:14px 0 5px}
.sec{margin:24px 0 10px}
.tabs{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(249,246,241,.95);border:1px solid rgba(169,138,79,.5);padding:5px;border-radius:999px;box-shadow:0 6px 20px rgba(31,27,22,.10);max-width:432px;margin:0 auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tabs button{flex:1;border:0;background:none;color:var(--soft);padding:12px 0;letter-spacing:.08em;font-size:19px;border-radius:999px}.tabs button.on{color:var(--ink);background:var(--tint);box-shadow:none}
.hero{position:relative;overflow:hidden;height:270px;margin-bottom:14px;border-radius:22px;border:1px solid var(--gold)}
.gar{font-family:'Cormorant Garamond','EB Garamond',Garamond,'Palatino Linotype',Palatino,Georgia,serif}
.cn{font-family:'Cormorant Garamond','EB Garamond',Garamond,'Palatino Linotype',Palatino,Georgia,serif;font-weight:500;font-variant:small-caps;letter-spacing:.07em;font-size:40px;line-height:1.1;margin:8px 0 2px}
.ts{font:italic 500 21px 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;text-align:center;color:var(--soft);margin:0 0 12px}
.kw{text-align:center;font:600 21px/1.4 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;font-variant:small-caps;letter-spacing:.14em;color:var(--ink);margin:4px 0 10px}
.mt{font:italic 500 19px/1.45 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;text-align:center;color:var(--soft);margin:0 0 2px}
.fl{font:500 20px/1.55 'Cormorant Garamond','EB Garamond',Garamond,'Palatino Linotype',Palatino,Georgia,serif;text-align:center;margin:0 auto 18px;color:#3a352e;max-width:30em}
.cx{text-align:center;font:600 18px/1.55 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;font-variant:small-caps;letter-spacing:.12em;margin:0 0 2px;color:var(--ink)}
.cx a.l{text-decoration:none;border-bottom:1px solid rgba(169,138,79,.6);color:inherit}
.sb{font:600 19px/1.1 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;font-variant:small-caps;letter-spacing:.08em;text-transform:none;background:transparent;color:var(--ink);border:1px solid rgba(169,138,79,.55);padding:13px 14px;border-radius:999px;flex:1}
.pnl button.on,.note button.on{background:var(--paper);border-color:var(--ink)}
.sb.main{background:var(--tint);border-color:var(--gold)}
.sb:active{background:var(--tint)}
.ql{font:italic 500 19px 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;text-transform:none;letter-spacing:.02em;color:var(--soft);background:none;border:none;padding:8px 12px;border-radius:0}
.qrow{display:flex;justify-content:center;gap:14px;margin:4px 0 6px}
.cx .cap{font:inherit;letter-spacing:inherit;color:var(--gold);text-transform:none}
.us{margin:0 auto 6px;padding-left:22px;max-width:30em;font:500 20px/1.5 'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;color:#3a352e}.us li{margin:0 0 6px}
.inb{max-width:30em;margin:0 auto 12px;text-align:center}.inr{display:flex;align-items:center;justify-content:center;gap:10px}.inr .tag{margin:0}.inp{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font:600 22px/1 Lato,sans-serif;padding:0;cursor:pointer}.inn{font:italic 500 19px/1.5 'Cormorant Garamond',Garamond,Georgia,serif;color:var(--soft);margin:8px 6px 0;white-space:pre-wrap}.ine{margin-top:8px}.ine textarea{width:100%;border:1px solid var(--gold);border-radius:14px;background:transparent;padding:10px 12px;font:500 18px/1.4 'Cormorant Garamond',Garamond,Georgia,serif;color:var(--ink);margin-bottom:8px;resize:vertical}
.det{margin:22px 0 6px;border-top:1px solid var(--gold);padding-top:6px}
.det summary{cursor:pointer;text-align:center;color:var(--gold);font:700 12px Lato,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:12px 8px;list-style:none}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:' \25be'}
.det[open] summary::after{content:' \25b4'}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hbtn{position:absolute;bottom:10px;right:10px;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);background:rgba(249,246,241,.94);border-radius:50%;z-index:2}.hbtn.l{right:60px}
.cred{font-size:11px;color:var(--soft);text-align:center;margin:-8px 0 12px}.cred:empty{display:none}
.tile{border:1px solid var(--gold);border-radius:16px;padding:10px 12px;background:var(--paper)}.soft{color:var(--soft);font-size:13px}.tile b{font:700 15px Lato,sans-serif;word-break:break-word}.p{font:17px/1.6 Lora,serif;margin:0 0 8px}
.kv{border:1px solid var(--gold);border-radius:16px;padding:12px 14px;background:var(--paper);margin:0 0 10px}.kv .k{font:700 11px Lato,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}.kv .v{font:18px/1.45 Lora,serif;color:var(--ink)}
.gear{position:absolute;top:18px;right:18px;z-index:5;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);background:var(--paper);border-radius:50%}#set{position:absolute;top:64px;right:18px;z-index:6;background:var(--paper);border:1px solid var(--gold);padding:14px;width:210px;border-radius:18px}#set[hidden]{display:none}
.pnl{border-radius:18px;background:var(--tint);border:1px solid var(--gold);padding:14px;margin:0 0 14px}.wrap{display:flex;flex-wrap:wrap;gap:8px}.wrap button{padding:8px 12px}.wrap .sw{padding:0}.dots{flex:none;width:50px;height:50px;font-size:30px;font-weight:700;line-height:1;padding:0}.act{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.act button{padding:7px 11px}
#q,#lq{border-radius:999px;padding-left:20px}.dots{border-radius:50%}
a.l{color:var(--gold);cursor:pointer;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

var AT={'Amethyst':['A calming stone linked to clear thinking, intuition and spiritual awareness. Often kept near the bed or used in meditation.','Traditionally used to ease stress and restless thoughts and to support sleep. Some people also use it for tension and headaches.'],
'Rose quartz':['The stone of gentle love: warmth, compassion and self-acceptance. Soft and soothing rather than intense.','Traditionally associated with emotional comfort after a loss or a hard time, easing resentment, and supporting the heart area.'],

'Citrine':['A bright, warm stone linked to optimism, confidence, motivation and prosperity.','Traditionally used to lift low mood and low energy, support creativity, and ease the solar plexus and digestion.'],

'Malachite':['A powerful stone of change. It is said to bring hidden feelings to the surface and encourage honesty with yourself.','Traditionally used for emotional release and personal transformation. Handle with care: it contains copper, so keep it dry and never use it in elixirs.'],
'Moonstone':['A soft, glowing stone tied to the moon, natural cycles, intuition and new beginnings.','Traditionally associated with emotional balance, calming mood swings and supporting restful sleep.'],
'Carnelian':['A warm orange stone linked to energy, courage, creativity and motivation.','Traditionally used to boost vitality and drive, ease low motivation, and support the sacral area.'],
'Green aventurine':['A gentle stone of luck, optimism and opportunity, often called a stone of good fortune.','Traditionally associated with calming the heart, easing worry and supporting a sense of wellbeing and renewal.'],

'Tiger’s eye':['A golden-brown stone of grounded confidence, clear judgment and steady willpower.','Traditionally used to ease self-doubt and indecision, support focus, and balance emotional ups and downs.']};
var AT2={"Labradorite": ["A stone of change and inner vision, known for the flash of blue and gold that appears as you tilt it. Said to shield the aura and spark intuition.", "Traditionally used to ease worry during transitions and to support imagination and trust in your path."], "Selenite": ["A pale, luminous stone linked to calm, clarity and cleansing the space around it. Often used to clear other crystals.", "Traditionally used to quiet the mind and ease tension before sleep. Soft and water-soluble, so keep it dry."], "Smoky quartz": ["A grounding stone, said to release heavy thoughts and stress and help you feel steady and practical.", "Traditionally associated with easing anxiety and tension and letting go of worry. Often kept at a desk or carried on hard days."], "Fluorite": ["A clarifying stone linked to focus, mental order and learning. Said to cut through mental fog.", "Traditionally used to support concentration and calm scattered thinking. Soft and easily scratched, so avoid water and sun."], "Sodalite": ["A deep blue stone of calm logic and honest self-expression, said to bring order to your thoughts.", "Traditionally associated with easing nervous tension, overthinking and fear of speaking up."], "Aquamarine": ["A clear sea-blue stone of calm courage and gentle communication, linked to water and peace.", "Traditionally used to ease fear, nervous tension and stress, and to support a clear voice."], "Amazonite": ["A soft blue-green stone said to calm worry and support the courage to speak honestly and set boundaries.", "Traditionally associated with easing anxiety and irritability and balancing the emotions."], "Jade": ["A stone of harmony, luck and balance, treasured in Asia for thousands of years.", "Traditionally associated with calm, emotional balance and a sense of wellbeing, and with the heart."], "Turquoise": ["A sky-blue stone of protection and good fortune, worn for centuries across many cultures.", "Traditionally associated with calm, emotional var FRX={"A calming stone linked to clear thinking, intuition and spiritual awareness. Often kept near the bed or used in meditation.": "Une pierre apaisante liée à la clarté d’esprit, à l’intuition et à la conscience spirituelle. Souvent gardée près du lit ou utilisée en méditation.", "Traditionally used to ease stress and restless thoughts and to support sleep. Some people also use it for tension and headaches.": "Traditionnellement utilisée pour apaiser le stress et les pensées agitées et favoriser le sommeil. Certains l’utilisent aussi contre les tensions et les maux de tête.", "Purple quartz, from pale lilac to deep violet. Found as crystal points, clusters and geodes.": "Quartz violet, du lilas pâle au violet profond. Se trouve en pointes, en amas et en géodes.", "Common and easy to find.": "Courante et facile à trouver.", "Brazil, Uruguay, Zambia, Madagascar, Mexico": "Brésil, Uruguay, Zambie, Madagascar, Mexique", "The stone of gentle love: warmth, compassion and self-acceptance. Soft and soothing rather than intense.": "La pierre de l’amour doux : chaleur, compassion et acceptation de soi. Plus apaisante qu’intense.", "Traditionally associated with emotional comfort after a loss or a hard time, easing resentment, and supporting the heart area.": "Traditionnellement associée au réconfort émotionnel après une perte ou une période difficile, à l’apaisement du ressentiment et au soutien de la zone du cœur.", "Soft pale pink, often cloudy or translucent. Usually found in solid chunks rather than points.": "Rose pâle doux, souvent laiteux ou translucide. Se trouve généralement en blocs massifs plutôt qu’en pointes.", "Common.": "Courante.", "Brazil, Madagascar, India, South Africa, USA": "Brésil, Madagascar, Inde, Afrique du Sud, États-Unis", "The all-purpose crystal. It is said to amplify energy, intentions and the effects of other stones, and to bring clarity.": "Le cristal à tout faire. On dit qu’il amplifie l’énergie, les intentions et les effets des autres pierres, et qu’il apporte de la clarté.", "Traditionally used as a general balancer and to support focus. Often placed with other crystals to strengthen them.": "Traditionnellement utilisé comme équilibrant général et pour soutenir la concentration. Souvent placé avec d’autres cristaux pour les renforcer.", "Transparent to milky white with a glassy shine. Six-sided points or clusters.": "Transparent à blanc laiteux, avec un éclat vitreux. Pointes à six faces ou amas.", "Very common.": "Très courante.", "Brazil, USA, Madagascar and many other countries": "Brésil, États-Unis, Madagascar et de nombreux autres pays", "A strong protective and grounding stone, said to block negativity and steady the mind.": "Une pierre de protection et d’ancrage puissante, dite capable de bloquer la négativité et de stabiliser l’esprit.", "Traditionally associated with easing tension and anxiety and with feeling safe and centered. Often placed by doors or carried when traveling.": "Traditionnellement associée à l’apaisement des tensions et de l’anxiété et au sentiment de sécurité et de centrage. Souvent placée près des portes ou emportée en voyage.", "Opaque jet black, with long rods that have fine grooves along their length. Often found in rock.": "Noir de jais opaque, en longs bâtonnets finement striés dans leur longueur. Souvent prise dans la roche.", "Brazil, Pakistan, Namibia, Madagascar, USA": "Brésil, Pakistan, Namibie, Madagascar, États-Unis", "A bright, warm stone linked to optimism, confidence, motivation and prosperity.": "Une pierre lumineuse et chaleureuse liée à l’optimisme, à la confiance, à la motivation et à la prospérité.", "Traditionally used to lift low mood and low energy, support creativity, and ease the solar plexus and digestion.": "Traditionnellement utilisée pour remonter le moral et l’énergie, soutenir la créativité et apaiser le plexus solaire et la digestion.", "Pale yellow to golden or orange-brown quartz. Much of what is sold has been heat-treated from amethyst or smoky quartz.": "Quartz jaune pâle à doré ou brun orangé. Une grande partie de ce qui se vend provient d’améthyste ou de quartz fumé chauffés.", "Natural citrine is fairly rare; heat-treated stones are common.": "La citrine naturelle est assez rare ; les pierres chauffées sont courantes.", "Brazil, Madagascar, Zambia, Russia": "Brésil, Madagascar, Zambie, Russie", "A deep blue stone of truth, wisdom and honest communication, treasured since ancient times.": "Une pierre d’un bleu profond, symbole de vérité, de sagesse et de communication honnête, précieuse depuis l’Antiquité.", "Traditionally associated with calming the mind, easing stress, and supporting the throat and speaking up with confidence.": "Traditionnellement associée à l’apaisement de l’esprit et du stress, au soutien de la gorge et à la confiance pour s’exprimer.", "Deep blue rock with golden flecks of pyrite and white streaks of calcite.": "Roche bleu profond avec des paillettes dorées de pyrite et des traînées blanches de calcite.", "Fairly uncommon; top quality is rare.": "Assez peu courante ; la qualité supérieure est rare.", "Afghanistan (the classic source), Chile, Russia, Pakistan": "Afghanistan (la source classique), Chili, Russie, Pakistan", "A powerful stone of change. It is said to bring hidden feelings to the surface and encourage honesty with yourself.": "Une pierre de changement puissante. On dit qu’elle fait remonter les sentiments cachés et encourage l’honnêteté envers soi-même.", "Traditionally used for emotional release and personal transformation. Handle with care: it contains copper, so keep it dry and never use it in elixirs.": "Traditionnellement utilisée pour la libération émotionnelle et la transformation personnelle. À manipuler avec soin : elle contient du cuivre, donc gardez-la au sec et ne l’utilisez jamais en élixir.", "Bright green with swirling bands and rings of lighter and darker green. Opaque and takes a good polish.": "Vert vif avec des bandes et des anneaux tourb
