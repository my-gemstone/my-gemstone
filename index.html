function cap(c){return c.charAt(0).toUpperCase()+c.slice(1)}
function fm(t){return esc(t).replace(/([A-Za-z)])(\d+)/g,'$1<sub>$2</sub>')}
function hb(v){var m=String(v||'').match(/[\d.]+/g);if(!m)return '';var t=Math.round(parseFloat(m[m.length-1])),o='';for(var i=1;i<=10;i++)o+='<i style="flex:1;height:8px;border-radius:4px;background:'+(i<=t?'var(--gold)':'rgba(128,128,128,.25)')+'"></i>';return '<div class="tile" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="soft">Hardness (Mohs scale)</span><b class="serif" style="font-size:24px">'+esc(v)+'</b></div><div style="display:flex;gap:4px;margin-top:8px">'+o+'</div></div>'}
function tiles(s){var a=[['Luster',s.luster],['Streak',s.streak],['Formula',s.formula]].filter(function(x){return x[1]});return a.length?'<div style="display:flex;gap:8px;flex-wrap:wrap">'+a.map(function(x){return '<div class="tile" style="flex:1 1 90px"><div class="soft">'+x[0]+'</div><b>'+fm(x[1])+'</b></div>'}).join('')+'</div>':''}
function dots(s){return '<div style="display:flex;gap:14px;flex-wrap:wrap">'+cl(s).map(function(c){return '<div style="text-align:center"><div style="width:38px;height:38px;border-radius:50%;background:'+(COL[c]||'#888')+';outline:1px solid var(--gold);outline-offset:2px;margin:0 auto 6px"></div><span class="soft">'+cap(c)+'</span></div>'}).join('')+'</div>'}
function tc(b,c){var k=FC.indexOf(c);if(k>=0)FC.splice(k,1);else FC.push(c);b.className=k>=0?'':'on'}
function dl(id,k,x){var a=(x||[]).slice();S.stones.forEach(function(s){if(s[k]&&a.indexOf(s[k])<0)a.push(s[k])});return '<datalist id="'+id+'">'+a.map(function(v){return '<option value="'+esc(v)+'">'}).join('')+'</datalist>'}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
function chip(s,c){return '<div class="chip" style="background:'+bg(s)+'"></div>'}
function go(v){V=v;editId=v==='add'?null:editId;del=null;draw();scrollTo(0,0)}
function head(){var w=S.stones.filter(function(s){return s.status==='want'}).length;
return '<div class="med"><svg width="42" height="42" viewBox="0 0 28 28"><polygon points="14,3 24,10 20,24 8,24 4,10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 10 L14 14 L24 10 M14 3 L8 24 M14 14 L20 24" fill="none" stroke="currentColor" stroke-width="1"/></svg></div><div class="cap" style="text-align:center">Stone Journal</div><h1>'+S.stones.length+' stones</h1><p class="sub">'+(S.stones.length-w)+' owned, '+w+' on my wishlist</p><div class="rule"><i></i><b></b><i></i></div>'}
function draw(){['index','add','data'].forEach(function(t){$('t-'+t).className=(V===t||(V==='detail'&&t==='index'))?'on':''});
if(V==='index')drawIndex();else if(V==='detail')drawDetail();else if(V==='add')drawForm();else drawData()}
function btn(t,on,fn){return '<button class="'+(on?'on':'')+'" onclick="'+fn+'">'+t+'</button>'}
function drawIndex(){
var h=head();
if(!S.last)h+='<div class="note">You have not made a backup yet.<button onclick="go(\'data\')">Back up now</button></div>';
var d=S.stones[Math.floor(Date.now()/864e5)%Math.max(S.stones.length,1)];
if(d)h+='<div class="card" tabindex="0" onclick="openS(\''+d.id+'\')"><div class="chip" style="background:'+bg(d)+'"></div><div><div class="cap">Stone of the day</div><h3>'+esc(d.name)+'</h3><p>'+esc(d.intents.join(', '))+'</p></div></div>';
h+='<input id="q" placeholder="Search a stone or a meaning" value="'+esc(F.q)+'" oninput="F.q=this.value;list()" aria-label="Search">';
h+='<div class="row" style="margin-top:12px">'+btn('All',F.st==='all',"F.st='all';drawIndex()")+btn('Owned',F.st==='own',"F.st='own';drawIndex()")+btn('Want',F.st==='want',"F.st='want';drawIndex()")+'</div>';
h+='<div class="cap" style="margin:4px 0 6px">I need…</div><div class="scroll">'+INT.map(function(i){return btn(i,F.it===i,"F.it=F.it==='"+i+"'?'':'"+i+"';drawIndex()")}).join('')+'</div>';
h+='<div class="cap" style="margin:4px 0 6px">Color</div><div class="scroll">'+Object.keys(COL).map(function(c){return '<button class="sw'+(F.co===c?' sel':'')+'" style="background:'+COL[c]+'" aria-label="'+c+'" onclick="F.co=F.co===\''+c+'\'?\'\':\''+c+'\';drawIndex()"></button>'}).join('')+'</div>';
h+='<div class="row"><select id="so" onchange="F.sort=this.value;list()" aria-label="Sort"><option value="az">Sort: A to Z</option><option value="new">Sort: Recently added</option><option value="color">Sort: Color</option></select><button onclick="F.grid=!F.grid;drawIndex()">'+(F.grid?'List':'Grid')+'</button></div><div id="list"></div>';
$('app').innerHTML=h;$('so').value=F.sort;list()}
function list(){
var q=F.q.toLowerCase(),a=S.stones.filter(function(s){
if(F.st!=='all'&&s.status!==F.st)return false;if(F.it&&s.intents.indexOf(F.it)<0)return false;if(F.co&&cl(s).indexOf(F.co)<0)return false;
return !q||(s.name+' '+s.meaning+' '+s.type+' '+s.intents.join(' ')+' '+s.origin).toLowerCase().indexOf(q)>=0});
if(F.sort==='az')a.sort(function(x,y){return x.name.localeCompare(y.name)});else if(F.sort==='color')a.sort(function(x,y){return x.color.localeCompare(y.color)});else a=a.slice().reverse();
var h=a.map(function(s){return '<div class="card" tabindex="0" onclick="openS(\''+s.id+'\')">'+chip(s)+'<div><h3>'+esc(s.name)+'</h3><p>'+esc(s.intents.join(', '))+(s.status==='want'?' · wishlist':'')+'</p></div></div>'}).join('');
if(!a.length)h='<p class="sub">No stones match. Try another color or intention.</p>';
$('list').innerHTML=F.grid?'<div class="grid">'+h+'</div>':h}
function openS(id){cur=id;del=null;V='detail';draw();scrollTo(0,0)}
function find(n){var l=n.toLowerCase();return S.stones.filter(function(s){return s.name.toLowerCase()===l})[0]}
function drawDetail(){
var s=S.stones.filter(function(x){return x.id===cur})[0];if(!s){go('index');return}
var h='<button class="gold" onclick="go(\'index\')">Back</button><div class="hero" style="background:'+bg(s)+';margin-top:14px"></div><div class="cap" style="text-align:center">'+(s.status==='own'?'Owned':'On my wishlist')+'</div><h1 style="font-size:34px">'+esc(s.name)+'</h1><p class="sub">'+esc([s.type,s.origin].filter(Boolean).join(' · '))+'</p><div class="rule"><i></i><b></b><i></i></div>';
h+=(s.tags&&s.tags.length?'<div style="text-align:center;margin-bottom:6px">'+s.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div>':'');
if(s.hardness||s.luster||s.streak||s.formula)h+='<span class="cap lbl">Properties</span>'+hb(s.hardness)+tiles(s);
h+='<span class="cap lbl">Colors</span>'+dots(s);
h+='<span class="cap lbl">Meaning</span><p class="p">'+esc(s.meaning||'Add a meaning in Edit.')+'</p><div>'+s.intents.map(function(i){return '<span class="tag">'+i+'</span>'}).join('')+'</div>';
if(s.chakra||s.cleanse)h+='<span class="cap lbl">Chakra and cleansing</span><p class="p">'+[s.chakra&&'Chakra: '+esc(s.chakra),s.cleanse&&'Cleansing: '+esc(s.cleanse)].filter(Boolean).join('<br>')+'</p>';
if(s.pairs.length)h+='<span class="cap lbl">Works well with</span><p class="p">'+s.pairs.map(function(n){var f=find(n);return f?'<a class="l" onclick="openS(\''+f.id+'\')">'+esc(n)+'</a>':esc(n)}).join(', ')+'</p>';
if(s.status==='want'&&(s.where||s.price||s.size))h+='<span class="cap lbl">Wishlist notes</span><p class="p">'+[s.where&&'Where: '+esc(s.where),s.price&&'Price: '+esc(s.price),s.size&&'Size: '+esc(s.size)].filter(Boolean).join('<br>')+'</p>';
if(s.note)h+='<span class="cap lbl">My note</span><p class="p" style="font-style:italic;color:var(--soft)">'+esc(s.note)+'</p>';
h+='<div class="row" style="margin-top:20px">'+btn(s.status==='own'?'Move to wishlist':'Mark as owned',true,'flip()')+btn('Edit',false,'edit()')+'</div><div class="row">'+btn(del?'Tap again to delete':'Delete',false,'rm()')+'</div>';
$('app').innerHTML=h}
function flip(){var s=S.stones.filter(function(x){return x.id===cur})[0];s.status=s.status==='own'?'want':'own';sv();draw()}
function rm(){if(!del){del=1;draw();return}S.stones=S.stones.filter(function(x){return x.id!==cur});sv();go('index')}
function edit(){editId=cur;V='add';draw();scrollTo(0,0)}
var FI=[],FC=[];
function drawForm(){
var s=editId?S.stones.filter(function(x){return x.id===editId})[0]:{name:'',type:'',color:'purple',status:'own',intents:[],meaning:'',origin:'',pairs:[],note:'',where:'',price:'',size:'',chakra:'',hardness:'',cleanse:''};
FI=s.intents.slice();FC=cl(s).slice();
var h=head().replace(/<h1>.*?<\/h1>/,'<h1>'+(editId?'Edit stone':'Add a stone')+'</h1>');
h+='<span class="cap lbl">Name</span><input id="f-name" style="font-style:normal" value="'+esc(s.name)+'" placeholder="Labradorite" oninput="sg(this.value)" autocomplete="off"><div id="f-sg"></div>';
h+='<span class="cap lbl">Type or mineral</span><input id="f-type" style="font-style:normal" value="'+esc(s.type)+'" placeholder="Feldspar" list="dl-ty">';
h+='<span class="cap lbl">Status</span><select id="f-st"><option value="own">Owned</option><option value="want">Want</option></select>';
h+='<span class="cap lbl">Colors</span><div id="f-cc">'+Object.keys(COL).map(function(c){return '<button type="button" class="'+(FC.indexOf(c)>=0?'on':'')+'" style="margin:0 6px 6px 0;padding:8px 12px" onclick="tc(this,\''+c+'\')">'+cap(c)+'</button>'}).join('')+'</div>';
h+='<span class="cap lbl">Category tags (comma separated)</span><input id="f-ta" style="font-style:normal" value="'+esc((s.tags||[]).join(', '))+'" placeholder="Gem, Quartz variety">';
h+='<span class="cap lbl">Luster</span><input id="f-lu" style="font-style:normal" value="'+esc(s.luster)+'" placeholder="Vitreous">';
h+='<span class="cap lbl">Streak</span><input id="f-sk" style="font-style:normal" value="'+esc(s.streak)+'" placeholder="White">';
h+='<span class="cap lbl">Formula</span><input id="f-fo" style="font-style:normal" value="'+esc(s.formula)+'" placeholder="SiO2">';
h+='<span class="cap lbl">Intentions</span><div id="f-in">'+INT.map(function(i){return '<button type="button" class="'+(FI.indexOf(i)>=0?'on':'')+'" style="margin:0 6px 6px 0;padding:8px 12px" onclick="ti(this,\''+i+'\')">'+i+'</button>'}).join('')+'</div>';
h+='<span class="cap lbl">Meaning</span><textarea id="f-me">'+esc(s.meaning)+'</textarea>';
h+='<span class="cap lbl">Chakra</span><input id="f-ch" style="font-style:normal" value="'+esc(s.chakra)+'" placeholder="Heart">';
h+='<span class="cap lbl">Hardness (Mohs scale)</span><input id="f-ha" style="font-style:normal" value="'+esc(s.hardness)+'" placeholder="7">';
h+='<span class="cap lbl">Cleansing notes</span><input id="f-cl" style="font-style:normal" value="'+esc(s.cleanse)+'" placeholder="Moonlight, smoke">';
h+='<span class="cap lbl">Origin</span><input id="f-or" style="font-style:normal" value="'+esc(s.origin)+'" placeholder="Brazil" list="dl-or">';
h+='<span class="cap lbl">Works well with (names, separated by commas)</span><input id="f-pa" style="font-style:normal" value="'+esc(s.pairs.join(', '))+'">';
h+='<span class="cap lbl">Wishlist: where to buy</span><input id="f-wh" style="font-style:normal" value="'+esc(s.where)+'" list="dl-wh">';
h+='<div class="row" style="margin-top:12px"><input id="f-pr" style="font-style:normal" placeholder="Price" value="'+esc(s.price)+'"><input id="f-sz" style="font-style:normal" placeholder="Size" value="'+esc(s.size)+'"></div>';
h+='<span class="cap lbl">My note</span><textarea id="f-no">'+esc(s.note)+'</textarea><p id="f-err" class="p" style="color:#a8433a"></p>';
h+='<div class="row">'+btn('Save stone',true,'saveS()')+btn('Cancel',false,editId?"openS('"+editId+"')":"go('index')")+'</div>';
h+=dl('dl-ty','type',['Quartz','Feldspar','Tourmaline','Beryl','Jasper','Agate','Corundum'])+dl('dl-or','origin',['Brazil','Madagascar','Peru','India','Mexico'])+dl('dl-wh','where');
$('app').innerHTML=h;$('f-st').value=s.status}
function ti(b,i){var k=FI.indexOf(i);if(k>=0)FI.splice(k,1);else FI.push(i);b.className=k>=0?'':'on'}
function saveS(){
var n=$('f-name').value.trim();if(!n){$('f-err').textContent='Enter a name for the stone.';return}
var o={name:n,type:$('f-type').value.trim(),status:$('f-st').value,color:(FC[0]||'grey'),colors:FC.slice(),tags:$('f-ta').value.split(',').map(function(x){return x.trim()}).filter(Boolean),luster:$('f-lu').value.trim(),streak:$('f-sk').value.trim(),formula:$('f-fo').value.trim(),intents:FI.slice(),meaning:$('f-me').value.trim(),origin:$('f-or').value.trim(),pairs:$('f-pa').value.split(',').map(function(x){return x.trim()}).filter(Boolean),note:$('f-no').value.trim(),where:$('f-wh').value.trim(),chakra:$('f-ch').value.trim(),hardness:$('f-ha').value.trim(),cleanse:$('f-cl').value.trim(),price:$('f-pr').value.trim(),size:$('f-sz').value.trim()};
if(editId){var s=S.stones.filter(function(x){return x.id===editId})[0];for(var k in o)s[k]=o[k];cur=editId}
else{o.id='s'+Date.now();S.stones.push(o);cur=o.id}
sv();editId=null;V='detail';draw();scrollTo(0,0)}
function drawData(){
var j=JSON.stringify({app:'stone-journal',stones:S.stones});
var h=head()+'<div class="note">'+(S.last?'Last backup: '+new Date(S.last).toLocaleDateString():'You have not made a backup yet.')+'</div>';
h+='<span class="cap lbl">Back up</span><p class="p">Copy this text and keep it somewhere safe, like a note to yourself.</p><textarea id="bk" style="min-height:120px;font-size:12px" readonly>'+esc(j)+'</textarea><div class="row" style="margin-top:10px">'+btn('Copy backup',true,'cp()')+'</div><p class="p" id="cm"></p>';
h+='<span class="cap lbl">Restore</span><p class="p">Paste a backup here. This replaces the stones on this device.</p><textarea id="rs" style="min-height:90px;font-size:12px"></textarea><div class="row" style="margin-top:10px">'+btn('Restore',false,'rs()')+'</div><p class="p" id="rm"></p>';
$('app').innerHTML=h}
function cp(){var t=$('bk');t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}
try{if(navigator.clipboard)navigator.clipboard.writeText(t.value)}catch(e){}
S.last=Date.now();sv();$('cm').textContent='Backup copied. If nothing was copied, select the text and copy it by hand.'}
function rs(){var m=$('rm');try{var d=JSON.parse($('rs').value);if(!d||!Array.isArray(d.stones))throw 0;S.stones=d.stones;S.init=1;sv();m.textContent=d.stones.length+' stones restored.';setTimeout(function(){go('index')},900)}catch(e){m.textContent='That backup could not be read. Paste the full text and try again.'}}
draw();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
